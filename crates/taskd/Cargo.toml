[package]
name = "taskd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
libc = "0.2.189"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
taskd-core = { version = "0.1.0", path = "../taskd-core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "signal", "sync"] }
