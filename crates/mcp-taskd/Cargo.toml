[package]
name = "mcp-taskd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
taskd-core = { version = "0.1.0", path = "../taskd-core" }
tokio = { version = "1.53.1", features = ["rt", "macros", "io-std"] }
ureq = { version = "3.4.0", default-features = false, features = ["json"] }
