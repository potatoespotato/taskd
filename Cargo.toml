[workspace]
resolver = "3"
members = ["crates/taskd-core", "crates/taskd", "crates/mcp-taskd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskd-core = { path = "crates/taskd-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
